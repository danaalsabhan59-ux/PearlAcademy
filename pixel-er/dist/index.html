<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1a2e">
<meta name="description" content="PIXEL ER — the Emergency Medicine Club's interactive Case of the Week.">
<title>PIXEL ER — Case of the Week</title>
<style>/* PIXEL ER — styles. Club palette: ink #0F2540, red #D22B2B, gold #A98A50. */
:root {
  --ink: #0f2540; --ink-2: #0b1a2e; --ink-3: #142f52; --red: #d22b2b; --red-d: #a81e1e; --gold: #c9a35a;
  --paper: #f2f5f9; --white: #fff; --line: #e3e9f0; --muted: #657f98; --green: #0e8c6c; --amber: #c4870a;
  --px-border: 3px solid var(--ink); --radius: 6px;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: radial-gradient(ellipse at top, #16365e 0%, var(--ink-2) 60%) fixed; color: var(--ink); font: 15px/1.5 var(--sans); min-height: 100vh; -webkit-tap-highlight-color: transparent; }
button { font: inherit; cursor: pointer; color: inherit; }
kbd { font: 12px var(--mono); background: #fff; color: var(--ink); border: 1px solid #b8c5d2; border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; }
.muted { color: var(--muted); }
a { color: #1d63b8; }
:focus-visible { outline: 3px solid #ffd23f; outline-offset: 2px; }

/* ---------- buttons ---------- */
.px-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--red); color: #fff; border: 0; border-radius: 4px; padding: 10px 16px; font-weight: 700; text-decoration: none;
  box-shadow: 0 4px 0 var(--red-d), inset 0 -2px 0 rgba(0,0,0,.12); transition: transform .06s; letter-spacing: .02em; }
.px-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--red-d); }
.px-btn.sm { padding: 6px 10px; font-size: 13px; box-shadow: 0 3px 0 var(--red-d); }
.px-btn.xs { padding: 3px 8px; font-size: 12px; box-shadow: 0 2px 0 var(--red-d); }
.px-btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 3px 0 #b8c5d2; border: 1px solid #cdd7e1; }
.px-ico { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); color: #fff; width: 34px; height: 34px; border-radius: 4px; display: inline-grid; place-items: center; }

/* ---------- home ---------- */
#app.home { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; color: #fff; }
.home-hero { display: flex; gap: 18px; align-items: center; margin: 8px 0 18px; }
.home-hero .logo { width: 84px; height: 84px; object-fit: contain; background: #fff; border-radius: 50%; padding: 6px; flex: none; }
.pixel-title { font: 900 clamp(38px, 9vw, 64px)/1 var(--mono); margin: 0; letter-spacing: .04em; color: #fff;
  text-shadow: 3px 3px 0 var(--red), 6px 6px 0 var(--ink); }
.tagline { font: 700 18px var(--mono); color: #ffd23f; margin: 8px 0 2px; letter-spacing: .06em; }
.sub { margin: 0; color: #a9bdd3; font-size: 13px; }
.avatar-pick { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; color: #cfe0f2; font-size: 14px; }
.avatar-pick button { padding: 3px; border: 2px solid transparent; background: rgba(255,255,255,.08); border-radius: 6px; line-height: 0; }
.avatar-pick button[aria-pressed="true"] { border-color: #ffd23f; }
.avatar-pick canvas { image-rendering: pixelated; width: 48px; height: 48px; border-radius: 3px; }
.home-h { font: 700 13px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #a9bdd3; margin: 26px 0 10px; }
.home-card { position: relative; background: var(--paper); color: var(--ink); border: var(--px-border); border-radius: var(--radius); padding: 18px 18px 16px; margin-bottom: 14px;
  box-shadow: 6px 6px 0 rgba(0,0,0,.35); }
.home-card.live { border-color: var(--red); box-shadow: 6px 6px 0 var(--red-d); }
.home-card h3 { margin: 8px 0 2px; font-size: 22px; }
.home-card .tag { margin: 0 0 6px; color: #33506e; }
.home-card .meta { margin: 0; font: 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.home-card .cc { margin: 10px 0; }
.home-card details { margin: 6px 0 12px; font-size: 14px; }
.home-card .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.best { font: 700 13px var(--mono); color: var(--green); }
.chip { display: inline-block; font: 700 11px var(--mono); letter-spacing: .1em; background: var(--ink); color: #fff; padding: 3px 8px; border-radius: 3px; }
.chip.live { background: var(--red); }
.chip.warn { background: #fff4d6; color: #7a5200; border: 1px solid #e6c36b; }
.empty { color: #cfe0f2; }
.howto { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15); border-radius: var(--radius); padding: 12px 16px; margin-top: 22px; color: #dbe7f3; }
.howto summary { cursor: pointer; font-weight: 700; }
.home-foot { margin-top: 26px; font-size: 13px; color: #8ea6bf; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: center; }
.home-foot p { margin: 0; max-width: 520px; }
.admin-link { color: #a9bdd3; font-size: 12px; }

/* ---------- game ---------- */
#app.playing { min-height: 100vh; }
.px-game { position: relative; max-width: 1100px; margin: 0 auto; padding: 8px 12px 24px; color: #fff; }
.px-ribbon { background: #fff4d6; color: #7a5200; font: 700 12px var(--mono); text-align: center; padding: 5px 8px; border-radius: 4px; margin-bottom: 6px; letter-spacing: .04em; }
.px-hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 6px 0 8px; }
.px-hud-l { display: flex; gap: 10px; align-items: center; min-width: 0; }
.px-hud-title { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.px-hud-title b { font: 700 16px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.px-hud-title span { font-size: 12px; color: #a9bdd3; }
.px-hud-m { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font: 13px var(--mono); }
.px-clock b { color: #ffd23f; }
.px-pill { padding: 2px 8px; border-radius: 3px; font: 700 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; background: #33506e; }
.px-pill.st-stable, .px-pill.st-improving { background: var(--green); }
.px-pill.st-unchanged { background: #8a6d1d; }
.px-pill.st-deteriorating { background: var(--red); animation: blink 1s steps(2) infinite; }
.px-pill.st-critical { background: #7a0d0d; animation: blink .5s steps(2) infinite; }
@keyframes blink { 50% { opacity: .55; } }
.px-vitals { display: flex; gap: 10px; }
.px-vitals b { color: #3dffa0; }
.px-vitals b.bad { color: #ff6b6b; }
.px-hud-r { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.px-stage { position: relative; border: 4px solid #050d18; border-radius: 6px; overflow: hidden; background: #050d18; box-shadow: 0 0 0 2px #2c4a70, 8px 8px 0 rgba(0,0,0,.35); }
.px-canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; aspect-ratio: 320 / 192; }
.px-prompt { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: rgba(15,37,64,.92); color: #fff; border: 2px solid #ffd23f; border-radius: 4px;
  padding: 6px 12px; font: 700 13px var(--mono); white-space: nowrap; max-width: 94%; overflow: hidden; text-overflow: ellipsis; }
.px-toast { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; max-width: 70%; }
.px-toast-item { background: rgba(15,37,64,.95); border-left: 4px solid #4fb3ff; padding: 6px 10px; font-size: 13px; border-radius: 3px; transition: opacity .4s, transform .4s; }
.px-toast-item.warn { border-color: #ffd23f; }
.px-toast-item.out { opacity: 0; transform: translateY(-6px); }
.px-help { font-size: 12px; color: #8ea6bf; margin: 8px 2px 0; }
.px-touch { display: none; }
@media (pointer: coarse) {
  .px-touch { display: flex; justify-content: space-between; align-items: center; padding: 12px 6px 4px; user-select: none; -webkit-user-select: none; touch-action: none; }
  .px-help { display: none; }
}
.px-dpad { display: grid; grid-template-columns: 52px 52px 52px; grid-template-rows: 52px 52px 52px; gap: 2px; }
.px-dpad button { background: #1d3557; border: 2px solid #3a5a85; color: #cfe0f2; border-radius: 6px; font-size: 18px; touch-action: none; }
.px-dpad button:active { background: #2c4a70; }
.px-dpad [data-k="up"] { grid-column: 2; grid-row: 1; } .px-dpad [data-k="left"] { grid-column: 1; grid-row: 2; }
.px-dpad [data-k="right"] { grid-column: 3; grid-row: 2; } .px-dpad [data-k="down"] { grid-column: 2; grid-row: 3; }
.px-abtn { width: 76px; height: 76px; border-radius: 50%; background: var(--red); border: 3px solid #ff7b7b; color: #fff; font: 900 26px var(--mono); box-shadow: 0 5px 0 var(--red-d); }

/* dialogue */
.px-dialog { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(760px, calc(100% - 24px)); background: #fdfdf8; color: var(--ink); border: 4px solid var(--ink);
  box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 5px #b8c5d2, 6px 6px 0 rgba(0,0,0,.4); border-radius: 4px; display: flex; gap: 12px; padding: 14px 16px; z-index: 30; cursor: pointer; }
.px-portrait { width: 72px; height: 72px; image-rendering: pixelated; border: 3px solid var(--ink); border-radius: 3px; flex: none; background: #cfe3f5; }
.px-dtext { flex: 1; min-width: 0; }
.px-dname { font: 700 13px var(--mono); color: var(--red); text-transform: uppercase; letter-spacing: .08em; }
.px-dline { margin: 4px 0 0; font-size: 16px; min-height: 3em; }
.px-dnext { align-self: flex-end; animation: blink 1s steps(2) infinite; font-size: 14px; }

/* panels */
.px-panel-wrap { position: fixed; inset: 0; background: rgba(5,13,24,.55); z-index: 20; display: grid; place-items: center; padding: 16px; }
.px-panel { background: var(--paper); color: var(--ink); width: min(760px, 100%); max-height: min(86vh, 900px); display: flex; flex-direction: column; border: 4px solid var(--ink); border-radius: 6px;
  box-shadow: inset 0 0 0 3px #fff, 8px 8px 0 rgba(0,0,0,.4); overflow: hidden; }
@media (max-width: 640px) { .px-panel-wrap { place-items: end stretch; padding: 0; } .px-panel { max-height: 88vh; border-radius: 10px 10px 0 0; border-bottom: 0; } }
.px-ph { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px 10px; background: var(--ink); color: #fff; }
.px-ph h2 { margin: 0; font: 700 17px var(--mono); }
.px-ph h2 small { display: block; font: 13px var(--sans); color: #a9bdd3; margin-top: 2px; }
.px-tabs { display: flex; gap: 2px; background: #dfe7ef; padding: 6px 8px 0; overflow-x: auto; }
.px-tabs button { border: 0; background: transparent; padding: 8px 12px; font-weight: 700; font-size: 14px; border-radius: 4px 4px 0 0; color: #33506e; white-space: nowrap; }
.px-tabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); box-shadow: inset 0 3px 0 var(--red); }
.px-badge { font-style: normal; background: var(--red); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; }
.px-pbody { padding: 12px 14px 18px; overflow-y: auto; }
.px-pbody h3 { font: 700 13px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 6px; }
.px-note { font-size: 13px; color: var(--muted); margin: 2px 0 10px; }
.px-empty { color: var(--muted); }
.px-actions, .px-results { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.px-actions button, .px-results button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; background: #fff; border: 2px solid #cdd7e1;
  border-bottom-width: 4px; border-radius: 5px; padding: 10px 12px; }
.px-actions button:hover, .px-results button:hover { border-color: var(--ink); }
.px-actions li.done button { background: #eef7f3; border-color: #b9dccf; }
.px-actions li.locked button, .px-results button[aria-disabled="true"] { opacity: .6; }
.px-al { font-weight: 600; }
.px-am { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
.px-resp { margin: 4px 4px 4px 14px; padding: 8px 10px; background: #fff; border-left: 4px solid var(--green); font-size: 14px; border-radius: 0 4px 4px 0; }
.px-why { margin: 2px 0 0 14px; font-size: 12px; color: #8a6d1d; }
.px-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-right: 6px; vertical-align: middle; }
.px-back { border: 0; background: none; color: #1d63b8; font-weight: 700; padding: 0; margin-bottom: 4px; }
.px-ecg-tools { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.px-ecg-tools button { width: 30px; height: 28px; border: 1px solid #cdd7e1; background: #fff; border-radius: 4px; font-weight: 700; }
.px-ecg { overflow: auto; border: 2px solid #e8b9b9; border-radius: 4px; background: #fff6f4; max-height: 60vh; }
.px-ecg canvas { display: block; }
.px-interp { background: #fff; border-left: 4px solid var(--ink); padding: 10px 12px; border-radius: 0 4px 4px 0; }
.px-labs { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; }
.px-labs th, .px-labs td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.px-labs th { font: 700 11px var(--mono); text-transform: uppercase; color: var(--muted); }
.px-labs tr.flag td { background: #fff1f1; }
.px-labs i { color: var(--red); font-style: normal; font-weight: 700; }
.px-img img { max-width: 100%; border-radius: 4px; background: #000; }
.px-img figcaption { font-size: 12px; color: var(--muted); }
.px-mon canvas { width: 100%; height: auto; display: block; border-radius: 4px; border: 3px solid #1b1f24; }
.px-vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px; margin-top: 8px; }
.px-vt { background: #04130d; color: #3dffa0; border-radius: 4px; padding: 8px 10px; display: flex; flex-direction: column; font-family: var(--mono); }
.px-vt span { font-size: 11px; opacity: .8; } .px-vt b { font-size: 24px; line-height: 1.1; } .px-vt small { font-size: 11px; opacity: .7; }
.px-vt.vt-BP { color: #ff8fd0; } .px-vt.vt-SpO₂ { color: #6fd3ff; } .px-vt.vt-RR { color: #ffe066; }
.px-vt.bad { box-shadow: inset 0 0 0 2px #ff3b3b; color: #ff6b6b; }
.px-log { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 14px; }
.px-log li { padding: 4px 0; border-bottom: 1px dashed var(--line); }
.px-t { font: 12px var(--mono); color: var(--muted); }

/* end screen */
.px-end { position: fixed; inset: 0; z-index: 40; background: rgba(5,13,24,.82); overflow-y: auto; padding: 24px 12px; }
.px-end-card { max-width: 760px; margin: 0 auto; background: var(--paper); color: var(--ink); border: 4px solid var(--ink); border-radius: 6px; box-shadow: inset 0 0 0 3px #fff, 8px 8px 0 rgba(0,0,0,.45); padding: 0 18px 20px; }
.px-outcome { margin: 0 -18px 16px; padding: 18px; color: #fff; }
.px-outcome span { font: 700 12px var(--mono); letter-spacing: .16em; opacity: .9; }
.px-outcome h2 { margin: 4px 0; font: 700 24px var(--mono); }
.px-outcome p { margin: 0; }
.o-good { background: var(--green); } .o-fair { background: #8a6d1d; } .o-poor { background: var(--red-d); }
.px-score { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.px-ring { --p: 0; width: 110px; height: 110px; border-radius: 50%; display: grid; place-content: center; text-align: center; background: conic-gradient(var(--red) calc(var(--p) * 1%), #dfe7ef 0); position: relative; }
.px-ring::before { content: ""; position: absolute; inset: 10px; background: var(--paper); border-radius: 50%; }
.px-ring b, .px-ring small { position: relative; font-family: var(--mono); } .px-ring b { font-size: 32px; line-height: 1; } .px-ring small { color: var(--muted); }
.px-xp { font: 900 24px var(--mono); color: var(--amber); }
.px-xp small { font-size: 13px; color: var(--muted); font-weight: 400; }
.px-bars { display: grid; gap: 6px; margin: 16px 0 6px; }
.px-bar { display: grid; grid-template-columns: minmax(120px, 210px) 1fr 70px; gap: 10px; align-items: center; font-size: 13px; }
.px-bar div { height: 10px; background: #dfe7ef; border-radius: 2px; overflow: hidden; }
.px-bar i { display: block; height: 100%; background: var(--ink); }
.px-bar b { font: 12px var(--mono); text-align: right; }
.px-end-card h3 { font: 700 13px var(--mono); text-transform: uppercase; letter-spacing: .08em; margin: 18px 0 6px; }
.px-end-card h3.warn { color: var(--red); }
.px-fb { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }
.px-fb i { font: normal 700 12px var(--mono); color: var(--muted); }
.px-fb.good li::marker { color: var(--green); } .px-fb.miss li::marker { color: var(--amber); } .px-fb.bad li { color: var(--red-d); }
.px-end-card details { margin-top: 12px; font-size: 14px; } .px-end-card summary { cursor: pointer; font-weight: 700; }
.px-refs { font-size: 13px; padding-left: 20px; }
.px-disclaimer { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 16px; }
.px-end-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

/* ---------- builder ---------- */
#app.admin { background: var(--paper); min-height: 100vh; }
.bd { color: var(--ink); }
.bd-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 16px; background: var(--ink); color: #fff; position: sticky; top: 0; z-index: 5; }
.bd-top b { font-family: var(--mono); color: #ffd23f; }
.bd-top-r { display: flex; gap: 6px; flex-wrap: wrap; }
.bd-saved { font-size: 12px; color: #3dffa0; opacity: 0; transition: opacity .3s; margin-left: 8px; } .bd-saved.on { opacity: 1; }
.bd-note { background: #fff4d6; color: #6b4b00; font-size: 13px; padding: 8px 16px; border-bottom: 1px solid #e6c36b; }
.bd-body { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 100px); }
@media (max-width: 820px) { .bd-body { grid-template-columns: 1fr; } }
.bd-list { border-right: 1px solid var(--line); padding: 12px; background: #fff; }
.bd-list h3 { font: 700 12px var(--mono); text-transform: uppercase; color: var(--muted); margin: 4px 0 8px; }
.bd-list ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.bd-list li button { width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 5px; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.bd-list li.on button { background: var(--paper); border-color: var(--ink); }
.bd-del { margin-top: 14px; background: none; border: 0; color: var(--red); font-size: 12px; text-decoration: underline; }
.st { font: 700 10px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.st-published, .st-faculty_approved, .st-scheduled { color: var(--green); } .st-draft, .st-faculty_review, .st-ai_reviewed { color: var(--amber); }
.err { color: var(--red); font-size: 12px; font-weight: 700; } .ok { color: var(--green); font-weight: 700; }
.bd-main { min-width: 0; }
.bd-secs { display: flex; gap: 2px; overflow-x: auto; padding: 8px 12px 0; background: #dfe7ef; position: sticky; top: 52px; z-index: 4; }
.bd-secs button { border: 0; background: none; padding: 8px 12px; font-weight: 700; font-size: 13px; color: #33506e; border-radius: 4px 4px 0 0; white-space: nowrap; }
.bd-secs button[aria-selected="true"] { background: var(--paper); color: var(--ink); box-shadow: inset 0 3px 0 var(--red); }
.bd-form { padding: 14px 18px 60px; max-width: 980px; }
.bd-form h2 { font: 700 18px var(--mono); margin: 18px 0 8px; } .bd-form h2 small { font: 13px var(--sans); color: var(--muted); }
.bd-form h3 { margin: 18px 0 6px; font-size: 15px; display: flex; gap: 10px; align-items: center; }
.bd-help { font-size: 13px; color: var(--muted); margin: 4px 0 10px; }
.bd-live { font-size: 13px; padding: 6px 10px; background: #fff; border: 1px solid var(--line); border-radius: 4px; display: inline-block; }
.bd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px 12px; }
.bd-grid.vit { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
.bd-f { display: flex; flex-direction: column; gap: 3px; font-size: 13px; margin-bottom: 6px; }
.bd-f.wide { grid-column: 1 / -1; }
.bd-f span { font-weight: 700; font-size: 12px; color: #33506e; }
.bd-f small, .bd-chk small { color: var(--muted); font-size: 11px; }

essment":5},"rubric":[{"id":"a_monitor","domain":"assessment","points":3,"when":{"within":["tx_monitor",5]},"good":"Monitor and defibrillator pads attached early.","missed":"Attach a monitor and defibrillator pads in the first minutes — STEMI patients can develop VF without warning."},{"id":"a_abcde","domain":"assessment","points":4,"when":{"all":[{"done":"ex_ab"},{"done":"ex_c"},{"done":"ex_d"}]},"good":"Structured ABCDE assessment.","missed":"Complete a structured A–B–C–D assessment."},{"id":"a_pain","domain":"assessment","points":3,"when":{"all":[{"done":"hx_onset"},{"done":"hx_character"}]},"good":"Characterised the pain (onset, nature, radiation).","missed":"Characterise the pain: onset, nature and radiation."},{"id":"a_assoc","domain":"assessment","points":2,"when":{"done":"hx_associated"},"good":"Asked about associated autonomic symptoms.","missed":"Ask about sweating, nausea and breathlessness."},{"id":"a_risk","domain":"assessment","points":2,"when":{"any":[{"done":"hx_pmh"},{"done":"hx_risk"}]},"good":"Established cardiovascular risk factors.","missed":"Establish cardiovascular risk factors and past history."},{"id":"a_allergy","domain":"assessment","points":2,"when":{"done":"hx_allergy"},"good":"Checked allergies.","missed":"Always check allergies before giving drugs."},{"id":"a_iv","domain":"assessment","points":2,"when":{"done":"tx_iv"},"good":"Secured IV access and sent bloods.","missed":"Secure IV access early."},{"id":"a_heart","domain":"assessment","points":2,"when":{"done":"ex_heart"},"good":"Auscultated for murmurs and rub.","missed":"Listen to the heart — a new murmur may point to a mechanical complication."},{"id":"r_dx","domain":"reasoning","points":10,"when":{"done":"dx_inf_rv"},"good":"Correct working diagnosis: inferior STEMI with RV involvement.","missed":"The working diagnosis was inferior STEMI with right ventricular involvement (ST↑ II, III, aVF; ST↑ in V4R)."},{"id":"r_dx_partial","domain":"reasoning","points":5,"countInMax":false,"when TEMI. It is non-specific and can mislead."},{"id":"m_aspirin","domain":"management","points":6,"when":{"done":"tx_aspirin"},"good":"Gave aspirin.","missed":"Give aspirin (e.g. 150–300 mg orally) as soon as ACS is suspected, unless contraindicated."},{"id":"m_aspirin_early","domain":"management","points":2,"when":{"within":["tx_aspirin",15]},"good":"Aspirin within 15 minutes.","missed":"Give aspirin early — within the first few minutes."},{"id":"m_cathlab","domain":"management","points":10,"when":{"done":"disp_cathlab"},"good":"Activated primary PCI.","missed":"Primary PCI is the preferred reperfusion strategy when it can be delivered promptly."},{"id":"m_cathlab_fast","domain":"management","points":4,"when":{"withinAfter":["inv_ecg","disp_cathlab",15]},"good":"Activated the cath lab within 15 minutes of the diagnostic ECG.","missed":"Activate the cath lab immediately after the diagnostic ECG. Every 10 minutes of delay costs myocardium."},{"id":"m_senior","domain":"management","points":3,"when":{"done":"tx_senior"},"good":"Escalated to a senior early.","missed":"Call for senior help early in a time-critical diagnosis."},{"id":"m_lysis","domain":"management","points":-8,"when":{"done":"tx_lysis"},"missed":"Fibrinolysis is for when primary PCI can't be delivered in time. With an on-site cath lab it adds bleeding risk without benefit."},{"id":"m_ccu","domain":"management","points":-10,"when":{"done":"disp_ccu"},"missed":"Admitting a STEMI without reperfusion is a major error."},{"id":"s_no_gtn","domain":"safety","points":6,"when":{"notDone":"tx_gtn"},"good":"Avoided nitrates in RV infarction.","missed":"Nitrates in RV infarction cause profound hypotension — the right ventricle is preload-dependent. Check V4R before giving nitrates in any inferior STEMI."},{"id":"s_allergy_first","domain":"safety","points":3,"when":{"before":["hx_allergy","tx_aspirin"]},"good":"Checked allergies before the first drug.","missed":"Check allergies before giving the first drug."},{"id":"s_no_lysis","domain":"safety","points":3,"when":{"notDone":"tx_lysis"},"good":"Avoided unnecessary fibrinolysis."},{"id":"s_no_o2","domain":"safety","points":3,"when":{"notDone":"tx_oxygen"},"good":"Withheld oxygen while SpO₂ was ≥ 90%.","missed":"Routine oxygen isn't indicated in ACS when SpO₂ is ≥ 90%."},{"id":"s_morphine_shock","domain":"safety","points":-5,"when":{"flag":"morphine_in_shock"},"missed":"Morphine in a hypotensive patient worsened the shock."},{"id":"s_hypo_untreated","domain":"safety","points":-4,"when":{"flag":"hypotension"},"missed":"The hypotension was never treated — in RV infarction, give cautious IV fluid boluses and reassess."},{"id":"re_after_tx","domain":"reassessment","points":3,"when":{"any":[{"after":["reassess","tx_aspirin"]},{"after":["reassess","tx_gtn"]},{"after":["reassess","tx_fluids"]},{"after":["reassess","tx_morphine"]}]},"good":"Reassessed after treatment.","missed":"Reassess after every intervention."},{"id":"re_after_fluids","domain":"reassessment","points":2,"appliesIf":{"flag":"hypotension_seen"},"when":{"after":["reassess","tx_fluids"]},"good":"Reassessed after the fluid bolus.","missed":"After a fluid bolus, reassess the response."},{"id":"re_twice","domain":"reassessment","points":2,"appliesIf":{"noFlag":"hypotension_seen"},"when":{"count":["reassess",">=",2]},"good":"Reassessed repeatedly while waiting for the cath lab.","missed":"Keep reassessing a STEMI patient while you wait for transfer."}]},"teaching":{"keyPoints":["Record a 12-lead ECG within 10 minutes of arrival for chest pain.","Inferior STEMI = ST elevation in II, III and aVF. ST elevation in III greater than II, with reciprocal change in aVL, points to the right coronary artery.","In every inferior STEMI, record V4R. ST elevation ≥ 1 mm means RV involvement.","RV infarction is preload-dependent: avoid nitrates, be careful with opioids and diuretics, and treat hypotension with cautious IV fluid.","Don't wait for troponin — STEMI is an ECG diagnosis, and reperfusion is time-critical.","Primary PCI is preferred when it can be delivered promptly. Fibrinolysis is for when it can't.","Oxygen only if SpO₂ \u003c 90%."],"pearls":["Raised JVP with clear lungs and hypotension in an inferior MI = think RV infarct.","Before antithrombotics, take 30 seconds to screen for aortic dissection."]},"references":[{"text":"Byrne RA, Rossello X, Coughlan JJ, et al. 2023 ESC Guidelines for the management of acute coronary syndromes. Eur Heart J. 2023;44(38):3720–3826.","url":"https://doi.org/10.1093/eurheartj/ehad191","date":"2023"},{"text":"Rao SV, O'Donoghue ML, Ruel M, et al. 2025 ACC/AHA/ACEP/NAEMSP/SCAI Guideline for the Management of Patients With Acute Coronary Syndromes. Circulation. 2025.","url":"","date":"2025"},{"text":"Hofmann R, James SK, Jernberg T, et al. Oxygen therapy in suspected acute myocardial infarction (DETO2X-AMI). N Engl J Med. 2017;377:1240–1249.","url":"https://doi.org/10.1056/NEJMoa1706222","date":"2017"}]}]</script>

<script>/* =====================================================================
   PIXEL ER — Clinical engine (pure logic, no DOM)
   ---------------------------------------------------------------------
   Every case is DATA (see docs/CASE_SCHEMA.md). This file interprets it.
   The simulation is fully deterministic: the same list of actions always
   produces the same patient course and the same score. That makes saves,
   replays and (later) server-side score verification trivial.
   ===================================================================== */
(function (root) {
  'use strict';

  var SCHEMA_VERSION = 1;

  var CATEGORIES = ['history', 'exam', 'reassess', 'treatment', 'procedure',
                    'investigation', 'diagnosis', 'disposition'];
  var DOMAINS = ['assessment', 'reasoning', 'investigations', 'management', 'safety', 'reassessment'];
  var DOMAIN_LABELS = {
    assessment: 'Initial assessment', reasoning: 'Clinical reasoning',
    investigations: 'Investigations & interpretation', management: 'Management priorities',
    safety: 'Patient safety', reassessment: 'Reassessment'
  };
  var DEFAULT_WEIGHTS = { assessment: 20, reasoning: 20, investigations: 15, management: 25, safety: 15, reassessment: 5 };
  var STATES = ['stable', 'improving', 'unchanged', 'deteriorating', 'critical'];
  var STATUSES = ['draft', 'ai_reviewed', 'faculty_review', 'faculty_approved', 'scheduled', 'published', 'archived'];
  var STATUS_LABELS = {
    draft: 'Draft', ai_reviewed: 'AI reviewed', faculty_review: 'Review required',
    faculty_approved: 'Approved', scheduled: 'Scheduled', published: 'Published', archived: 'Archived'
  };
  var VITAL_KEYS = ['hr', 'sbp', 'dbp', 'rr', 'spo2', 'temp', 'gcs', 'glucose'];
  var VITAL_LABELS = { hr: 'HR', sbp: 'SBP', dbp: 'DBP', rr: 'RR', spo2: 'SpO₂', temp: 'Temp', gcs: 'GCS', glucose: 'Glucose' };
  /* Which station in the ER handles each category (a case may override per action). */
  var STATION_FOR = {
    history: 'patient', exam: 'patient', reassess: 'patient',
    treatment: 'nurse', procedure: 'nurse',
    investigation: 'workstation', diagnosis: 'workstation', disposition: 'workstation'
  };

  function clone(o) { return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }
  function isObj(o) { return o && typeof o === 'object' && !Array.isArray(o); }

  /* ------------------------------------------------------------------
     Conditions — a small JSON language used by requires / events /
     endings / rubric.  See docs/CASE_SCHEMA.md for the full list.
     ------------------------------------------------------------------ */
  var COND_TYPES = ['all', 'any', 'not', 'done', 'notDone', 'last', 'flag', 'noFlag', 'before', 'after',
                    'within', 'withinAfter', 'count', 'vital', 'state', 'time'];

  function compare(a, op, b) {
    switch (op) {
      case '<': return a < b; case '<=': return a <= b;
      case '>': return a > b; case '>=': return a >= b;
      case '==': case '=': return a === b; case '!=': return a !== b;
    }
    return false;
  }

  function firstDone(S, id) {
    for (var i = 0; i < S.done.length; i++) if (S.done[i].id === id) return S.done[i];
    return null;
  }
  function lastDone(S, id) {
    for (var i = S.done.length - 1; i >= 0; i--) if (S.done[i].id === id) return S.done[i];
    return null;
  }

  function evalCond(c, S) {
    if (c === undefined || c === null || c === true) return true;
    if (c === false) return false;
    if (!isObj(c)) return false;
    var k = Object.keys(c)[0], v = c[k], a, b;
    switch (k) {
      case 'all': return (v || []).every(function (x) { return evalCond(x, S); });
      case 'any': return (v || []).some(function (x) { return evalCond(x, S); });
      case 'not': return !evalCond(v, S);
      case 'done': return !!firstDone(S, v);
      case 'notDone': return !firstDone(S, v);
      case 'last': return S.done.length > 0 && S.done[S.done.length - 1].id === v;
      case 'flag': return S.flags.indexOf(v) !== -1;
      case 'noFlag': return S.flags.indexOf(v) === -1;
      case 'before': /* [a, b]: a was done, and b was not done or done later */
        a = firstDone(S, v[0]); b = firstDone(S, v[1]);
        return !!a && (!b || a.idx < b.idx);
      case 'after': /* [a, b]: a was done at some point after b's first time */
        b = firstDone(S, v[1]); a = lastDone(S, v[0]);
        return !!a && !!b && a.idx > b.idx;
      case 'within': /* [id, minutes]: done no later than N minutes from arrival */
        a = firstDone(S, v[0]); return !!a && a.t <= v[1];
      case 'withinAfter': /* [a, b, minutes]: b done no later than N min after a */
        a = firstDone(S, v[0]); b = firstDone(S, v[1]);
        return !!a && !!b && b.idx > a.idx && (b.t - a.t) <= v[2];
      case 'count':
        return compare(S.done.filter(function (d) { return d.id === v[0]; }).length, v[1], v[2]);
      case 'vital': return compare(S.vitals[v[0]], v[1], v[2]);
      case 'state': return S.state === v;
      case 'time': return compare(S.t, v[0], v[1]);
    }
    return false;
  }

  /* Collect every action id / flag a condition mentions (used by the validator). */
  function condRefs(c, out) {
    out = out || { actions: [], flags: [] };
    if (!isObj(c)) return out;
    var k = Object.keys(c)[0], v = c[k];
    if (k === 'all' || k === 'any') (v || []).forEach(function (x) { condRefs(x, out); });
    else if (k === 'not') condRefs(v, out);
    else if (k === 'done' || k === 'notDone' || k === 'last') out.actions.push(v);
    else if (k === 'flag' || k === 'noFlag') out.flags.push(v);
    else if (k === 'before' || k === 'after') { out.actions.push(v[0]); out.actions.push(v[1]); }
    else if (k === 'within' || k === 'count') out.actions.push(v[0]);
    else if (k === 'withinAfter') { out.actions.push(v[0]); out.actions.push(v[1]); }
    return out;
  }

  /* Plain-English description of a condition (shown in the builder). */
  function describeCond(c, labelOf) {
    labelOf = labelOf || function (x) { return x; };
    if (c === undefined || c === null || c === true) return 'always';
    if (!isObj(c)) return String(c);
    var k = Object.keys(c)[0], v = c[k];
    switch (k) {
      case 'all': return (v || []).map(function (x) { return describeCond(x, labelOf); }).join(' AND ') || 'always';
      case 'any': return '(' + (v || []).map(function (x) { return describeCond(x, labelOf); }).join(' OR ') + ')';
      case 'not': return 'NOT ' + describeCond(v, labelOf);
      case 'done': return '“' + labelOf(v) + '” done';
      case 'notDone': return '“' + labelOf(v) + '” NOT done';
      case 'last': return '“' + labelOf(v) + '” just done';
      case 'flag': return 'flag ' + v;
      case 'noFlag': return 'no flag ' + v;
      case 'before': return '“' + labelOf(v[0]) + '” before “' + labelOf(v[1]) + '”';
      case 'after': return '“' + labelOf(v[0]) + '” after “' + labelOf(v[1]) + '”';
      case 'within': return '“' + labelOf(v[0]) + '” within ' + v[1] + ' min of arrival';
      case 'withinAfter': return '“' + labelOf(v[1]) + '” within ' + v[2] + ' min of “' + labelOf(v[0]) + '”';
      case 'count': return '“' + labelOf(v[0]) + '” done ' + v[1] + ' ' + v[2] + ' times';
      case 'vital': return (VITAL_LABELS[v[0]] || v[0]) + ' ' + v[1] + ' ' + v[2];
      case 'state': return 'patient ' + v;
      case 'time': return 'clock ' + v[0] + ' ' + v[1] + ' min';
    }
    return JSON.stringify(c);
  }

  /* ------------------------------------------------------------------
     Simulation
     ------------------------------------------------------------------ */
  function Sim(caseData) {
    this.c = caseData;
    this.actionsById = {};
    var self = this;
    (caseData.actions || []).forEach(function (a) { self.actionsById[a.id] = a; });
    this.eventsById = {};
    (caseData.events || []).forEach(function (e) { self.eventsById[e.id] = e; });
    var init = caseData.initial || {};
    this.S = {
      t: 0,
      vitals: Object.assign({}, init.vitals || {}),
      state: init.state || 'stable',
      flags: (init.flags || []).slice(),
      done: [],            /* {id, t, idx} */
      results: [],         /* {id, orderedAt, readyAt, notified} */
      scheduled: [],       /* {id, due} */
      fired: [],           /* event ids */
      armed: [],           /* event ids whose condition became true (delayed) */
      log: [],             /* {t, kind, speaker, text, ref} */
      history: [],         /* raw input log: action ids and "__wait:N" */
      vitalsTrail: [],     /* {t, vitals, state} */
      ended: null
    };
    if (init.monitorAttached) this.S.flags.push('monitor');
    this.S.vitalsTrail.push({ t: 0, vitals: clone(this.S.vitals), state: this.S.state });
    this.timeLimit = (caseData.setting && caseData.setting.timeLimitMin) || 60;
  }

  Sim.prototype.say = function (kind, speaker, text, ref) {
    var m = { t: this.S.t, kind: kind, speaker: speaker || '', text: text, ref: ref || null };
    this.S.log.push(m);
    return m;
  };

  Sim.prototype.applyEffects = function (fx, out) {
    if (!fx) return;
    var S = this.S, changed = false;
    if (fx.vitals) {
      Object.keys(fx.vitals).forEach(function (k) {
        if (fx.vitals[k] !== '' && fx.vitals[k] !== null && fx.vitals[k] !== undefined) { S.vitals[k] = Number(fx.vitals[k]); changed = true; }
      });
    }
    if (fx.state && STATES.indexOf(fx.state) !== -1 && fx.state !== S.state) { S.state = fx.state; changed = true; }
    (fx.flags || []).forEach(function (f) { if (S.flags.indexOf(f) === -1) S.flags.push(f); });
    (fx.unflags || []).forEach(function (f) { var i = S.flags.indexOf(f); if (i !== -1) S.flags.splice(i, 1); });
    if (changed) {
      S.vitalsTrail.push({ t: S.t, vitals: clone(S.vitals), state: S.state });
      if (out) out.vitalsChanged = true;
    }
  };

  /* Can this action be performed right now? */
  Sim.prototype.check = function (a) {
    var S = this.S;
    if (S.ended) return { ok: false, why: 'The case has ended.' };
    var repeatable = a.repeatable !== undefined ? a.repeatable : (a.category === 'reassess');
    if (!repeatable && firstDone(S, a.id)) return { ok: false, why: 'Already done.', done: true };
    if (a.group) {
      var self = this;
      var taken = S.done.some(function (d) { var x = self.actionsById[d.id]; return x && x.group === a.group; });
      if (taken) return { ok: false, why: 'You already made this choice.', done: !!firstDone(S, a.id) };
    }
    if (a.requires && !evalCond(a.requires, S)) return { ok: false, why: a.requiresText || 'Not possible yet.' };

  Builder.prototype.listOp = function (c, op, arrPath, i, el) {
    var arr = getPath(c, arrPath);
    if (!Array.isArray(arr)) { arr = []; setPath(c, arrPath, arr); }
    if (op === 'del') { if (!root.confirm('Remove this item?')) return; arr.splice(i, 1); }
    else if (op === 'up' && i > 0) { var x = arr[i]; arr[i] = arr[i - 1]; arr[i - 1] = x; }
    else if (op === 'down' && i < arr.length - 1) { var y = arr[i]; arr[i] = arr[i + 1]; arr[i + 1] = y; }
    else if (op === 'dup') { var d = Core.clone(arr[i]); if (d.id) d.id = uniqueId(d.id + '_copy', arr); arr.splice(i + 1, 0, d); }
    else if (op === 'add') {
      var kind = el.getAttribute('data-kind') || '';
      var item = {};
      if (arrPath === 'actions') { var cat = kind || 'history'; item = { id: uniqueId(({ history: 'hx', exam: 'ex', reassess: 'reassess', treatment: 'tx', procedure: 'proc', investigation: 'inv', diagnosis: 'dx', disposition: 'disp' })[cat] + '_new', arr), category: cat, label: 'New ' + CAT_LABELS[cat].toLowerCase(), time: 1, response: '' }; if (cat === 'diagnosis') { item.group = 'dx'; item.time = 0; } if (cat === 'investigation') item.result = { type: 'text', delay: 0, text: '' }; this.openCard = arr.length; }
      else if (arrPath === 'events') item = { id: uniqueId('ev_new', arr), when: { done: (c.actions[0] || {}).id }, delay: 0, speaker: 'Nurse', message: '' };
      else if (arrPath === 'endings') { item = { id: uniqueId('end_new', arr), title: 'New ending', outcome: 'fair', text: '', when: { done: (c.actions[0] || {}).id } }; arr.splice(Math.max(0, arr.length - 1), 0, item); this.persist(); this.render(); return; }
      else if (arrPath === 'scoring.rubric') item = { id: uniqueId('r_new', arr), domain: kind || 'assessment', points: 2, when: { done: (c.actions[0] || {}).id }, good: '', missed: '' };
      else if (arrPath === 'references') item = { text: '', url: '', date: '' };
      else if (/\.labs$/.test(arrPath)) item = { name: '', value: '', unit: '', ref: '', flag: '' };
      arr.push(item);
    }
    this.persist(); this.render();
  };

  Builder.prototype.sec_scoring = function (f, c) {

    var w = sc.weights || (sc.weights = Core.clone(Core.DEFAULT_WEIGHTS)), sum = 0; Core.DOMAINS.forEach(function (d) { sum += Number(w[d]) || 0; });

        '<div><h1 class="pixel-title">PIXEL&nbsp;ER</h1><p class="tagline">Your Shift. Your Decisions.</p>' +

    Array.prototype.forEach.call(app.querySelectorAll('[data-av]'), function (b) {

      b.onclick = function () { store('pxer.avatar', b.getAttribute('data-av')); Array.prototype.forEach.call(app.querySelectorAll('[data-av]'), function (x) { x.setAttribute('aria-pressed', x === b); }); };
    });
    var form = app.querySelector('.acct-form');
    if (form) form.onsubmit = function (e) {

      Online.signIn(mail).then(function (r) {

      });

  function alertMsg(el, msg) { var p = el.querySelector('.err') || el.appendChild(document.createElement('p')); p.className = 'err'; p.textContent = msg; }

  /* ---------------- play ---------------- */
  var SUBMIT_MSG = {
    not_signed_in: 'Your session expired — sign in again on the home page, then replay to submit.',
    not_a_member: 'This email isn\'t registered as a club member, so the score wasn\'t recorded.',
    case_not_available: 'This case isn\'t open for submissions.',
    not_finished: 'The case wasn\'t finished.',
    invalid_history: 'The server couldn\'t verify this attempt, so it wasn\'t recorded.',
    too_many_attempts: 'You\'ve reached the attempt limit for this case.',
    network: 'Couldn\'t reach the club server. Your attempt is saved on this device and will be sent automatically next time you open PIXEL ER.'
  };

  function play(c, opts) {
    stop();
    opts = opts || {};
    var vis = visibility(c), mode = opts.preview ? 'preview' : attemptMode(c, vis);
    var el = document.createElement('div'); app.innerHTML = ''; app.appendChild(el); app.className = 'playing';
    var g = new G.Game(el, c, Object.assign({
      avatar: store('pxer.avatar') || 'doctor_m',
      mode: mode,
      onExit: function () { location.hash = opts.preview ? '#admin' : ''; if (!opts.preview) home(); },
      onReplay: function () { play(c, Object.assign({}, opts, { fresh: true })); },
      onFinish: function (res, slot) {
        if (!slot) return;
        if (mode === 'preview') return;
        slot.hidden = false;
        if (mode === 'guest') { slot.className = 'px-submit info'; slot.innerHTML = 'Practice score — <a href="#">sign in with your club email</a> to compete on the leaderboard.'; return; }
        slot.className = 'px-submit wait'; slot.textContent = mode === 'official' ? 'Saving your official attempt…' : 'Saving your practice attempt…';
        Online.submit(c.id, res.history).then(function (r) {
          if (!r || r.error) { slot.className = 'px-submit bad'; slot.textContent = SUBMIT_MSG[r && r.error] || ('Not recorded: ' + (r && r.error)); return; }
          var board = '<a href="#board/' + encodeURIComponent(c.id) + '">🏆 View leaderboard</a>';
          if (r.official) { slot.className = 'px-submit ok'; slot.innerHTML = '✅ <b>Official score recorded: ' + r.score + '/100</b> (+' + r.xp + ' XP) · Rank <b>#' + r.rank + '</b> of ' + r.of + ' · ' + board; }
          else { slot.className = 'px-submit info'; slot.innerHTML = 'Practice attempt saved (' + r.score + '/100).' + (r.officialScore != null ? ' Your official score for this case is <b>' + r.officialScore + '/100</b>.' : ' Official attempts are closed for this case.') + ' ' + board; }
        });
      }
    }, opts));
    g.mount(); current = g;
  }

  /* ---------------- leaderboard ---------------- */
  function needMember(title) {
    app.className = 'home page';
    app.innerHTML = '<a class="back" href="#">← PIXEL ER</a><h1 class="page-h">' + title + '</h1>' +
      (connecting ? '<p class="muted">Connecting…</p>' : '<p>Leaderboards are for club members. <a href="#">Sign in on the home page</a> with your club email.</p>');
  }
  function bars(rows) {
    var max = Math.max.apply(null, rows.map(function (r) { return Number(r.participants); }).concat([1]));
    return rows.length ? '<div class="years">' + rows.map(function (r) {
      return '<div class="yr"><span>' + esc(r.study_level) + '</span><div><i style="width:' + Math.round(Number(r.participants) / max * 100) + '%"></i></div><b>' + r.participants + '</b></div>';
    }).join('') + '</div>' : '<p class="muted">No official attempts yet.</p>';
  }
  function caseOptions(sel, allowAll) {
    var list = allCases().filter(function (c) { var v = visibility(c); return v.visible && v.mode !== 'preview'; });
    return '<select class="case-pick">' + (allowAll ? '<option value=""' + (!sel ? ' selected' : '') + '>All cases — total XP</option>' : '') +
      list.map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === sel ? ' selected' : '') + '>' + esc(c.title) + '</option>'; }).join('') + '</select>';
  }
  function medal(n) { return n === 1 ? '🥇' : n === 2 ? '🥈' : n === 3 ? '🥉' : '#' + n; }

  function board(caseId) {
    stop();
    if (!onlineMember()) { needMember('Leaderboard'); return; }
    if (caseId === null) { var v = allCases().filter(function (c) { return visibility(c).mode === 'live'; })[0]; location.replace(v ? '#board/' + encodeURIComponent(v.id) : '#board/all'); return; }
    var c = caseId ? caseById(caseId) : null;
    app.className = 'home page';
    app.innerHTML = '<a class="back" href="#">← PIXEL ER</a><h1 class="page-h">🏆 Leaderboard</h1>' + caseOptions(caseId, true) +
      (c ? '<p class="muted">' + esc(c.title) + (c.schedule && c.schedule.closeAt ? ' · ' + (new Date(c.schedule.closeAt) > new Date() ? 'closes ' : 'closed ') + esc(fmtDate(c.schedule.closeAt)) : '') + '</p>' : '<p class="muted">Total XP from official attempts across all cases.</p>') +
      '<div class="board-body"><p class="muted">Loading…</p></div>';
    app.querySelector('.case-pick').onchange = function (e) { location.hash = '#board' + (e.target.value ? '/' + encodeURIComponent(e.target.value) : '/all'); };
    var body = app.querySelector('.board-body');
    var jobs = caseId ? [Online.leaderboard(caseId), Online.participation(caseId), Online.participation(null)] : [Online.overall(), Online.participation(null), Promise.resolve(null)];
    Promise.all(jobs).then(function (r) {
      var rows = r[0], me = rows.filter(function (x) { return x.is_me; })[0], top = rows.slice(0, 50);
      if (me && top.indexOf(me) === -1) top = top.concat([{ gap: true }, me]);
      var html = '';
      if (me) html += '<div class="me-card">Your position: <b>' + medal(Number(me.rank)) + '</b> of ' + rows.length + ' · ' + (caseId ? '<b>' + me.score + '/100</b>' : '<b>' + me.total_xp + ' XP</b>') + '</div>';
      else if (caseId) html += '<div class="me-card muted">You haven\'t submitted an official attempt for this case yet.</div>';
      html += rows.length ? '<table class="board"><thead><tr><th>Rank</th><th>Name</th><th>Year</th><th>' + (caseId ? 'Score</th><th>Time' : 'Total XP</th><th>Cases') + '</th></tr></thead><tbody>' + top.map(function (x) {
        if (x.gap) return '<tr class="gap"><td colspan="5">…</td></tr>';
        var n = Number(x.rank);
        return '<tr class="' + (x.is_me ? 'me' : '') + (n <= 3 ? ' podium' : '') + '"><td class="rk">' + medal(n) + '</td><td>' + esc(x.name) + '</td><td>' + esc(x.study_level || '—') + '</td>' +
          (caseId ? '<td><b>' + x.score + '</b></td><td>' + x.sim_minutes + ' min</td>' : '<td><b>' + x.total_xp + '</b></td><td>' + x.cases_played + '</td>') + '</tr>';
      }).join('') + '</tbody></table><p class="fine">Ties are broken by less time inside the case, then by who submitted first. Only each member\'s first completed shift (official attempt) counts.</p>' : '<p class="muted">No official attempts yet — be the first!</p>';
      html += '<h2 class="home-h">Most participating years' + (caseId ? ' — this case' : ' — all cases') + '</h2>' + bars(r[1]);
      if (caseId && r[2]) html += '<h2 class="home-h">Most participating years — all cases</h2>' + bars(r[2]);
      body.innerHTML = html;
    }, function (e) { body.innerHTML = '<p class="err">Couldn\'t load the leaderboard: ' + esc(e.message || e) + '</p>'; });
  }

  /* ---------------- results (club admins; supervisors can view) ---------------- */
  function csvCell(v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function results(caseId) {
    stop();
    if (!onlineMember() || !Online.canManage()) { needMember('Results'); if (onlineMember()) app.querySelector('p').textContent = 'Results are for club admins.'; return; }
    var list = allCases();
    if (!caseId && list.length) { var lv = list.filter(function (c) { return visibility(c).mode === 'live'; })[0] || list[0]; location.replace('#results/' + encodeURIComponent(lv.id)); return; }
    var c = caseById(caseId);
    app.className = 'home page wide';
    app.innerHTML = '<a class="back" href="#">← PIXEL ER</a><h1 class="page-h">📊 Results</h1><select class="case-pick">' + list.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === caseId ? ' selected' : '') + '>' + esc(x.title) + ' (' + esc(Core.STATUS_LABELS[x.status] || x.status) + ')</option>'; }).join('') + '</select><div class="res-body"><p class="muted">Loading…</p></div>';
    app.querySelector('.case-pick').onchange = function (e) { location.hash = '#results/' + encodeURIComponent(e.target.value); };
    var body = app.querySelector('.res-body');
    Online.results(caseId).then(function (rows) {
      var off = rows.filter(function (r) { return r.official; });
      var avg = off.length ? Math.round(off.reduce(function (a, r) { return a + r.score; }, 0) / off.length) : 0;
      var dom = {}; off.forEach(function (r) { Object.keys(r.breakdown || {}).forEach(function (k) { var d = dom[k] || (dom[k] = { p: 0, of: 0 }); d.p += Number(r.breakdown[k].points); d.of += Number(r.breakdown[k].of); }); });
      var endings = {}; off.forEach(function (r) { endings[r.ending] = (endings[r.ending] || 0) + 1; });
      var actLabel = function (id) { var a = c && (c.actions || []).filter(function (x) { return x.id === id; })[0]; return a ? a.label : id.indexOf('__wait:') === 0 ? 'Wait ' + id.slice(7) + ' min' : id; };
      var endTitle = function (id) { var e = c && (c.endings || []).filter(function (x) { return x.id === id; })[0]; return e ? e.title : id; };
      var html = '<div class="stats"><div><b>' + off.length + '</b><span>official attempts</span></div><div><b>' + avg + '</b><span>average score</span></div><div><b>' + (rows.length - off.length) + '</b><span>practice attempts</span></div></div>';
      if (off.length) {
        html += '<h2 class="home-h">Class performance by domain</h2><div class="years">' + Core.DOMAINS.filter(function (k) { return dom[k]; }).map(function (k) {
          var pc = Math.round(dom[k].p / dom[k].of * 100); return '<div class="yr"><span>' + esc(Core.DOMAIN_LABELS[k]) + '</span><div><i style="width:' + Math.max(0, pc) + '%"></i></div><b>' + pc + '%</b></div>';
        }).join('') + '</div><h2 class="home-h">Outcomes</h2><ul class="endings">' + Object.keys(endings).map(function (k) { return '<li>' + esc(endTitle(k)) + ': <b>' + endings[k] + '</b></li>'; }).join('') + '</ul>';
      }
      html += '<p><button class="px-btn sm ghost" data-csv>⬇ Download CSV</button></p><div class="tbl-wrap"><table class="board res"><thead><tr><th>Name</th><th>Year</th><th>Committee</th><th>Type</th><th>Score</th><th>XP</th><th>Time</th><th>Outcome</th><th>Submitted</th><th></th></tr></thead><tbody>' +
        rows.map(function (r, i) {
          return '<tr class="' + (r.official ? '' : 'practice') + '"><td>' + esc(r.full_name) + '</td><td>' + esc(r.study_level || '—') + '</td><td>' + esc(r.committee || '—') + '</td><td>' + (r.official ? 'Official' : 'Practice') + '</td><td><b>' + r.score + '</b></td><td>' + r.xp + '</td><td>' + r.sim_minutes + ' min</td><td>' + esc(endTitle(r.ending)) + '</td><td>' + esc(fmtDate(r.created_at)) + '</td><td><button class="linkbtn" data-tl="' + i + '">Timeline</button></td></tr>' +
            '<tr class="tl" hidden data-tlrow="' + i + '"><td colspan="10"><ol>' + (r.history || []).map(function (h) { return '<li>' + esc(actLabel(h)) + '</li>'; }).join('') + '</ol></td></tr>';
        }).join('') + '</tbody></table></div>';
      if (!rows.length) html = '<p class="muted">No attempts yet.</p>';
      body.innerHTML = html;
      Array.prototype.forEach.call(body.querySelectorAll('[data-tl]'), function (b) { b.onclick = function () { var row = body.querySelector('[data-tlrow="' + b.getAttribute('data-tl') + '"]'); row.hidden = !row.hidden; }; });
      var csv = body.querySelector('[data-csv]');
      if (csv) csv.onclick = function () {
        var lines = [['name', 'study_year', 'committee', 'type', 'score', 'xp', 'sim_minutes', 'outcome', 'submitted_at'].join(',')].concat(rows.map(function (r) {
          return [r.full_name, r.study_level, r.committee, r.official ? 'official' : 'practice', r.score, r.xp, r.sim_minutes, endTitle(r.ending), r.created_at].map(csvCell).join(',');
        }));
        var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], { type: 'text/csv' })); a.download = 'pixel-er-' + caseId + '-results.csv'; document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); }, 500);
      };
    }, function (e) { body.innerHTML = '<p class="err">Couldn\'t load results: ' + esc(e.message || e) + '</p>'; });
  }

  /* ---------------- builder ---------------- */
  function admin() {
    stop();
    var el = document.createElement('div'); app.innerHTML = ''; app.appendChild(el); app.className = 'admin';
    var b = new root.PXBuilder.Builder(el, {
      cases: LOCAL, config: CONFIG, online: Online,
      onPreview: function (c) { try { sessionStorage.setItem('pxer.preview', JSON.stringify(c)); } catch (e) { /* ignore */ } previewCase = c; location.hash = '#preview'; },
      onExit: function () { location.hash = ''; },
      onPublished: function () { Online.loadCases(); }
    });
    b.mount(); current = null; builderRef = b;
  }
  var builderRef = null;

  var previewCase = null;
  function route() {
    var hsh = location.hash || '';
    if (/access_token|error_description/.test(hsh)) { home(); return; }
    if (hsh.indexOf('#play/') === 0) {
      if (connecting) { stop(); app.className = 'home page'; app.innerHTML = '<p class="muted">Connecting to the club server…</p>'; return; }   /* so members never start in the wrong mode */
      var c = caseById(decodeURIComponent(hsh.slice(6)));
      if (c && visibility(c).visible) play(c, {}); else home();
    } else if (hsh.indexOf('#board') === 0) {
      var rest = hsh.slice(7);                       /* #board → this week · #board/all → total XP · #board/<id> */
      board(hsh === '#board' ? null : rest === 'all' ? '' : decodeURIComponent(rest));
    }
    else if (hsh.indexOf('#results') === 0) results(hsh.length > 9 ? decodeURIComponent(hsh.slice(9)) : '');
    else if (hsh === '#admin') admin();
    else if (hsh === '#preview') {
      var pc = previewCase;
      if (!pc) { try { pc = JSON.parse(sessionStorage.getItem('pxer.preview')); } catch (e) { pc = null; } }
      if (pc) play(pc, { preview: true, fresh: true }); else admin();
    } else home();
  }
  root.addEventListener('hashchange', route);
  route();

  /* Connect to the club server in the background; re-render when the account state is known. */
  function rerender() {
    if (location.hash === '#admin' && builderRef) builderRef.refreshOnline();   /* never remount the builder mid-edit */
    else if (!current || !current.running) route();
  }
  Online.onChange(rerender);
  Online.init(CONFIG).then(function () { connecting = false; rerender(); });
})(window);
</script>
</body>
</html>
